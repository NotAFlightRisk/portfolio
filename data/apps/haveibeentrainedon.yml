title: Have I Been Trained On?
category: other
featured: true
order: 9
tagline: Find out if your writing ended up in AI training data
about: >-
  If you've written anything online, it may well have been used to train an AI. Give this a link to
  something you wrote and it searches the big open training sets for your actual sentences, then
  tells you which sets they turned up in. Other checkers guess from an index, but this searches the
  text itself.
features:
  - Which AI models were trained on the sets it turned up in
  - Shows whether the copies are on your own site or someone else's
  - Handles a whole site too, by sampling a few of its posts
  - Never stores your writing, just a fingerprint of each sentence
tags:
  - AI
  - Privacy
site: https://haveibeentrainedon.peng.ly
