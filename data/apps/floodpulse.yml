title: floodpulse
category: data-visualisation
tagline: Keep an eye on river levels and flood warnings across England
about: >-
  floodpulse shows whether each of England's rivers is running high or low right now, compared with
  what's normal for that spot, so a big river and a little brook are easy to compare. It's good for
  checking on the river near you, but it isn't official, so for anything that matters, use the
  government's own flood service.
features:
  - A map of every river gauge in England, showing live water levels
  - Official flood warnings and alerts, with the areas they cover
  - Rivers that are rising stand out on the map
  - Whole rivers on one chart, from source to sea
  - How close each gauge is to its record level
tags:
  - UK
  - Maps
  - Realtime
  - Environment
site: https://floodpulse.peng.ly
