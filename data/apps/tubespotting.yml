title: Tube Spotting
category: data-visualisation
featured: true
tagline: A live map of every Tube train in London
about: >-
  Tube Spotting shows every train on the Underground, Elizabeth line, DLR and Overground as it
  moves, trams too. It's handy when you're stood on a platform wondering where yours has got to,
  and oddly relaxing if you just like watching trains.
features:
  - Countdown boards for every platform
  - Follow one train across London to see where it's off to
  - Planned closures, first and last trains and busy times for every station
  - Real geography, or a layout like TfL's own Tube map
  - Your nearest station, without your location ever leaving your device
tags:
  - UK
  - Transport
  - Realtime
  - Maps
site: https://tubespotting.peng.ly
