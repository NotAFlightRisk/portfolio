title: Security Reporting Toolbox
category: other
tagline: Find a CWE, look up CVEs and GHSAs, score CVSS, check EPSS and KEV, and build version ranges
about: >-
  Writing up a vulnerability turns into a load of little errands, like finding the right CWE,
  scoring it in CVSS, checking KEV and working out how to write the affected versions. This puts
  eight tools for those jobs in one place, each talking straight to the official source from your
  browser, with no accounts or tracking. Paste whatever you've got (a CVE, a CVSS vector, a package
  name or a link) and it sends you to the right one.
features:
  - CVE and GHSA lookup with CVE.org, NVD, GitHub and OSV side by side
  - CVSS 3.1 and 4.0 calculator that decodes and checks vectors too
  - CWE explorer with MITRE's mapping guidance, plus Top 25 and OWASP views
  - EPSS and KEV checks for a whole list of CVEs in one go
  - Affected and patched version ranges for GitHub advisories, tested against real releases
  - Package lookup with PURLs, and a directory of who can assign a CVE for what
site: https://security-reporting-toolbox.peng.ly
