title: Security Reporting Toolbox
category: other
featured: true
order: 6
tagline: Tools for writing up a security vulnerability, all in one place
about: >-
  Writing up a vulnerability turns into a load of little errands, like finding the right CWE,
  scoring it in CVSS and working out which versions are affected. This puts the tools for those
  jobs in one place, each going straight to the official source, with no accounts or tracking.
features:
  - Look up any CVE in CVE.org, NVD, GitHub and OSV side by side
  - A CVSS 3.1 and 4.0 calculator that explains any score you paste in
  - Signs of exploitation for a whole list of CVEs in one go
  - Get the affected versions right for a GitHub advisory
  - Find out who can give your bug a CVE
tags:
  - Security
  - GitHub
  - Developer tools
site: https://security-reporting-toolbox.peng.ly
