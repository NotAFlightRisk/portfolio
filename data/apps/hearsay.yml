title: hearsay
category: data-visualisation
featured: true
order: 8
tagline: Watch the internet's routing live on a 3D globe
about: >-
  The internet's made of about 80,000 networks that each tell their neighbours which addresses they
  can reach, and hardly anyone checks what gets passed on, so it more or less runs on hearsay. This
  draws that chatter as it happens and points out anything that looks off. Network nerds will get
  the most out of it, but the globe's fun to watch either way.
features:
  - Flags possible route leaks and hijacks as they happen
  - Confirmed outages and hijacks from Cloudflare Radar and IODA
  - A routing forecast for each region, in the style of the shipping forecast
  - See how any network connects to the rest of the internet
  - Light on mobile data, at about 10 KB a second
tags:
  - Realtime
  - Maps
  - Internet
  - Outages
site: https://hearsay.peng.ly
