title: The Enshittification Index
category: research
tagline: A dated, sourced record of big tech making things worse
about: >-
  Prices go up, ads creep in, and features you liked end up behind a paywall. The Enshittification
  Index logs those changes at the big services back to 2007, each with the date, a quote from the
  source and an archived copy. Every quote's rechecked against its source each week, so it's a bit
  more than a list of grumbles.
features:
  - Price history for every paid plan, next to inflation
  - The subscriptions that have gone up most since 2020
  - Compare what you pay now with any year since 2010
  - A count of the days since big tech last made something worse
  - All of it free to reuse, with a feed for new changes
tags:
  - Big tech
  - Open data
site: https://enshittification.peng.ly
