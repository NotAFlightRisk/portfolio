title: Token Usage Dashboard
category: other
featured: true
order: 7
tagline: See where your Claude Code, Codex and OpenCode tokens go
about: >-
  Ever wondered what your AI habit would cost at API prices? This turns your Claude Code, Codex and
  OpenCode history into a dashboard, and it all stays on your machine. It keeps your history even
  after the tools tidy away their old transcripts, too.
features:
  - The past year on a calendar, day by day
  - Which projects, tools and models your tokens went on
  - Where you're at with your Anthropic and OpenAI plan limits
  - Up and running with one command
tags:
  - AI
  - Developer tools
  - Self-hosting
install: npx token-usage-dashboard
screenshots:
  - alt: Thirty days of usage at 7.4B tokens, with a calendar heatmap, plan windows and daily totals
