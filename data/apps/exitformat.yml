title: Exit Format
category: research
featured: true
order: 4
tagline: How to take your data with you when you leave an app
about: >-
  Exporting from an app rarely gets you everything, and it's nicer to find that out before you
  leave. Exit Format covers every way out of notes apps, password managers and 2FA apps so far, and
  where you can go next.
features:
  - What's in each export, and what gets left behind
  - Guides for moving between apps, showing what comes with you
  - Every app that can open a given file format
  - How to close your account once you're out
  - The data's open for anyone to build on
tags:
  - Privacy
  - Open data
site: https://exitformat.peng.ly
