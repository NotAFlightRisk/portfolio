title: Parallax
category: mini-tools
tagline: Merge logs from several machines into one timeline
about: >-
  When something breaks across a few machines, their logs never quite agree on what time it was.
  Parallax lines them up so you can read the whole incident in order. It all happens in your
  browser, so your logs never get uploaded anywhere.
features:
  - Nudge a drifted clock back into line
  - Reads syslog, journalctl, access logs and more, or a format of your own
  - Stack traces stay with the error they belong to
  - Copes with up to six logs and 250,000 lines at once
  - A sample outage to try it on first
tags:
  - Developer tools
  - Outages
site: https://parallax.peng.ly
screenshots:
  - path: /
    alt: Three logs from one outage lined up, with the api clock pulled back 3m56s so the errors match
    click:
      - button.demo
      - 'button.chip:has-text("Anchor")'
      - '.line:has-text("02:14:01 +0000")'
      - '.line:has-text("persisted id=88213")'
      - 'button.chip:has-text("Anchor")'
      - '.line:has-text("02:14:01 +0000")'
      - '.line:has-text("41.220 ms")'
  - path: /
    alt: The sample incident before any nudging, with the api's log landing four minutes after everything else
