title: Steely Mouse
category: mini-tools
tagline: Change your SteelSeries mouse's DPI, lighting and buttons
about: >-
  Steely Mouse gives your SteelSeries mouse a proper settings page, rather than a pile of
  command-line flags. It runs on your own computer and works with any mouse the rivalcfg project
  supports, and new ones usually just work as soon as they're added.
features:
  - Saves to the mouse itself, so your settings stick after a reboot
  - Gradient lighting, not just solid colours
  - Brings your colours back on newer mice that forget them when they nod off
  - A demo mode to try it without a mouse plugged in
  - One download for Linux, macOS or Windows
tags:
  - Hardware
install: pipx install git+https://github.com/NotAFlightRisk/steely-mouse
screenshots:
  - alt: Five DPI presets for an Aerox 3 Wireless as sliders, with the polling rate underneath
  - alt: Lighting settings for the mouse's three LED strips, with colour pickers and a rainbow switch
  - alt: Sleep and dim timers above the button mapping, with a button to save it all to the mouse
