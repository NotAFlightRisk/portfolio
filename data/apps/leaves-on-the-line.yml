title: Leaves on the Line
category: data-visualisation
tagline: Why Britain's trains were late, cause by cause
about: >-
  Network Rail puts a cause on every delay, from signal failures to swans on the line, and
  publishes the lot as open data that hardly anyone outside the industry reads. Leaves on the Line
  turns it into a page for every station, route and operator, so you can see whether a bad week was
  down to leaves, signals or the trains themselves.
features:
  - Delay by cause for every station, route and operator
  - A map of where each kind of delay starts
  - Month by month trends going back to April 2018
  - The odd ones, like cows, trampolines and sunlight on signals
  - Every figure as CSV and JSON, naming the file it came from
tags:
  - UK
  - Transport
  - Open data
site: https://leaves.peng.ly
