title: Track the Gap
category: data-visualisation
tagline: How the Tube's really running right now, line by line
about: >-
  TfL's status board can say "Good Service" while you've been stood on the platform for ten
  minutes. Track the Gap works out the real gaps between trains on every Tube line, live, and checks
  them against the timetable.
features:
  - Every Tube line ranked by how well it's running, worst first
  - Spots big gaps and bunched-up trains as they happen
  - Extra waiting time for each line, measured the way TfL does it
  - A diagram of each line showing where the gaps are
tags:
  - UK
  - Transport
  - Realtime
site: https://track-the-gap.peng.ly
