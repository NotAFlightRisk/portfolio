title: peng-top
category: self-hosted
tagline: A system monitor for your browser, like htop with proper graphs
about: >-
  peng-top puts what your computer's up to in a browser tab, live: CPU, memory, disks, network,
  sensors and processes. It's one small download for Linux, macOS or Windows, and it only listens on
  your own machine unless you tell it otherwise.
features:
  - Works entirely from the keyboard
  - Themes like Catppuccin, Nord, Dracula and Gruvbox
  - Raw readings as JSON or a live stream, for your own scripts
  - An optional login if you want to check on it from another device
  - A Docker image too, for watching a server
tags:
  - Self-hosting
  - Monitoring
  - Realtime
  - Hardware
install: curl -fsSL https://raw.githubusercontent.com/NotAFlightRisk/peng-top/main/scripts/install.sh | sh
screenshots:
  - alt: The overview tab, with CPU and memory graphs, disk and network usage, and the busiest processes
