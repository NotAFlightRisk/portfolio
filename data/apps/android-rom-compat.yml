title: Android ROM Compat
category: research
featured: true
tagline: Which custom ROMs run on your Android phone, and how well
about: >-
  Custom ROMs can keep an old phone going for years or get Google off it altogether, but finding one
  that actually supports your phone is a faff. Here you can see which ROMs officially run on it,
  what works on each, and whether its maker even lets you into the bootloader. Where nobody's
  checked something, it says so rather than guessing.
features:
  - Check a phone's bootloader isn't locked for good before you buy it
  - What actually works on each phone, ROM by ROM
  - Compare ROMs side by side, down to how they handle Google apps
  - The latest official build for each phone
  - The whole dataset free to download
tags:
  - Privacy
  - Big tech
  - Open data
site: https://android-rom-compat.peng.ly
