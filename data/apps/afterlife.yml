title: Hacker Afterlife
category: data-visualisation
tagline: Dead links on Hacker News since 2007, with archived copies
about: >-
  Old Hacker News threads still get read, but plenty of the links at the top of them don't work any
  more. Hacker Afterlife has checked over 250,000 of them, and about 3 in 10 from 2007 are dead now.
  Where a link has died, it points you to the Wayback Machine's copy instead.
features:
  - Check whether any old thread's link still works
  - The front page from 5, 10 and 15 years ago today
  - See how well links to any website have lasted
  - Every result free to download and reuse
tags:
  - Open data
  - Internet
site: https://afterlife.peng.ly
screenshots:
  - path: /
    alt: Every Hacker News story since 2007 as a dot, coloured by whether its link still works
  - path: /day
    alt: The front page from five, ten and fifteen years ago today, with how each link fared
  - path: /graveyard
    alt: The graveyard of top stories whose links have died, each one pointing to its Wayback copy
