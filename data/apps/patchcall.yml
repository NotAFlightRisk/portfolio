title: Patchcall
category: self-hosted
tagline: Security advisories for the apps you self-host, flagged only when there's a fix for the version you run
about: >-
  Patchcall looks at the containers on your Docker host, works out which app and version each one
  is, and checks that app's own security advisories on GitHub. You only hear from it when an
  advisory catches your version and there's a fixed release to move to, and the rest of the time it
  keeps quiet. Image scanners mostly flag base-image CVEs and miss advisories for apps like Jellyfin
  or Immich, and update checkers can't tell a security fix from a new emoji picker.
features:
  - One alert per fix you actually need, naming the version to move to
  - Knows the 50-odd most popular self-hosted images, and reads image labels for the rest
  - Says so when it can't tell your version, rather than calling it clear
  - Marks anything on CISA's list of known exploited vulnerabilities
  - Alerts by ntfy, Gotify, Apprise, email or webhook, plus an RSS feed
  - Checks apps outside Docker from a short YAML list
site: https://patchcall.peng.ly
install: |-
  curl -fsSLO https://raw.githubusercontent.com/NotAFlightRisk/patchcall/main/docker/compose.yaml
  docker compose up -d
screenshots:
  - path: /
    alt: A demo homelab with nine apps to patch, each with its advisories and the version to move to
  - path: /
    alt: The apps it can't check, one worth a look by hand, and the ones with nothing to patch
    scroll: '#unreadable'
