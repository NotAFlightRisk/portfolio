title: Patchcall
category: self-hosted
tagline: Security alerts for your self-hosted apps, only when there's a fix
about: >-
  Image scanners mostly nag about the base image and miss the advisories for apps like Jellyfin or
  Immich, and update checkers can't tell a security fix from a new emoji picker. Patchcall checks
  the apps on your Docker host against their own security advisories, and only speaks up when your
  version's affected and there's a fix to move to.
features:
  - One alert per fix you need, naming the version to move to
  - Flags anything that's known to be exploited in the wild
  - Says so when it can't tell your version, rather than calling it safe
  - Alerts by ntfy, Gotify, email, webhook and more
  - Can check apps outside Docker too
tags:
  - Self-hosting
  - Security
  - Monitoring
  - Docker
site: https://patchcall.peng.ly
install: |-
  curl -fsSLO https://raw.githubusercontent.com/NotAFlightRisk/patchcall/main/docker/compose.yaml
  docker compose up -d
screenshots:
  - path: /
    alt: A demo homelab with nine apps to patch, each with its advisories and the version to move to
  - path: /
    alt: The apps it can't check, one worth a look by hand, and the ones with nothing to patch
    scroll: '#unreadable'
