title: fineprint
category: research
featured: true
order: 1
tagline: A VPN comparison with no affiliate links and a source for every claim
about: >-
  Most "best VPN" lists turn out to be adverts. fineprint grades over 200 VPNs on how private they
  really are, like what they log, where they're based and who's audited them, and every grade links
  to its source. There are no sponsors either, so nobody's paying for a good score.
features:
  - Filter by what matters to you, like no logs or anonymous sign-up
  - Red flags spelled out, including trackers in the app and funding review sites
  - A full breakdown for every provider, with a history of changes
  - Every grade follows the same published rules
  - All of it free to use in your own projects
tags:
  - Privacy
  - Security
  - Open data
site: https://fineprint.peng.ly
