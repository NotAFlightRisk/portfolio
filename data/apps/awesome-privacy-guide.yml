title: Awesome Privacy Guide
category: research
tagline: Private alternatives to the apps you use every day
about: >-
  Awesome Privacy Guide is an easier way to browse the Awesome Privacy list. Look up an app you use
  now, like Gmail, Chrome or WhatsApp, and you'll see the private alternatives the list recommends,
  with what's on record about each. It's in eight languages, and every page links back to the
  original list.
features:
  - Hundreds of private apps, sorted by what they're for
  - Each app's audits and source code, where they're on record
  - Short guides on 2FA, password managers and what to do after a breach
  - Build your own privacy toolkit and share it as a link
  - Updated from the original list every morning
tags:
  - Privacy
  - Security
  - Big tech
site: https://awesomeprivacy.peng.ly
screenshots:
  - path: /
    alt: The home page, with a search for the app you want to replace and the latest additions
  - path: /alternatives/gmail/
    alt: The private alternatives to Gmail, starting with ProtonMail and Tuta, each with its evidence
    scroll: 'h3:has-text("Tuta")'
  - path: /communication/encrypted-email/forward-email/
    alt: Forward Email's page, with its evidence panel for source code, audits and payments
  - path: /stack/
    alt: The toolkit builder, picking one private app for each job and sharing the list as a link
    click: ['text=Mullvad Browser', 'text=DuckDuckGo', 'text=ProtonMail']
