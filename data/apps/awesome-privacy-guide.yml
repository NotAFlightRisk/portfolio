title: Awesome Privacy Guide
category: research
tagline: Private alternatives to the apps you use every day, from the Awesome Privacy list, in eight languages
about: >-
  This is an easier way to browse the Awesome Privacy list, with 406 privacy-respecting picks across
  95 topics, each on its own page in eight languages. Look up the app you're using now, like Gmail,
  Chrome or WhatsApp, and you'll see what the list suggests instead, with comparisons and an
  evidence panel that only shows what's on record. It doesn't add apps of its own, and every page
  links back to the original list.
features:
  - 406 private alternatives across 95 topics, searchable by the app you use now
  - Every app, topic and swap gets its own page, in eight languages
  - An evidence panel from the list, GitHub and ToS;DR that only shows what's on record
  - Short guides on 2FA, password managers, VPNs and what to do after a data breach
  - A toolkit builder for picking one app per job, shared as a link or Markdown
  - Synced with the upstream list every morning
site: https://awesomeprivacy.peng.ly
screenshots:
