title: statusquo
category: other
tagline: All the status pages you rely on, on one board
about: >-
  If your app leans on GitHub, Cloudflare, npm and a payment provider, checking whether any of them
  is having a bad morning means a lot of tabs. statusquo puts them on one board, with what's broken
  now, what broke recently and what's planned next. There's nothing to sign up for, either.
features:
  - More than 100 services ready to add, or any status page you like
  - Bookmark or share a board, as it all lives in the link
  - An RSS feed for every board
  - Eight themes, including Nord, Solarized and Terminal
  - Run your own copy with Docker, with your board as the homepage
tags:
  - Self-hosting
  - Monitoring
  - Outages
  - Developer tools
site: https://statusquo.peng.ly
