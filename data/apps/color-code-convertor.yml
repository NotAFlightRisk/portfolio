title: Color Code Convertor
category: mini-tools
tagline: Convert any colour code to hex, RGB, HSL, OKLCH and more
about: >-
  Got a colour in one format and need it in another? You'll get it in seventeen others at once, each
  ready to copy, along with lighter and darker shades. It all runs in your browser, so it's quick.
features:
  - Values ready to paste into Android, Flutter and Swift
  - The nearest CSS colour name for any colour
  - A colour picker, plus a random button for when you're stuck
  - Every format explained, for when you're not sure which one you need
tags:
  - Developer tools
site: https://color-code-convertor.peng.ly
