title: carbonara
category: data-visualisation
tagline: How clean Britain's electricity is now, and when it'll be cleaner
about: >-
  carbonara tells you how much carbon is going into Britain's electricity right now, and how that'll
  change over the next two days, for the whole country or just your area. Good for timing the
  washing machine to when the grid's cleanest.
features:
  - What the grid's running on right now
  - The cleanest time to start a job, however long it runs
  - A 48-hour forecast for each part of the country
  - How this time of year compares with every year since 2017
tags:
  - UK
  - Maps
  - Realtime
  - Environment
site: https://carbonara.peng.ly
screenshots:
  - path: /
    alt: How clean Britain's grid is right now on a barometer, next to the fuel mix behind it
    wait: 3000
  - path: /
    alt: The 14 regions of the grid on a map, with a fortnight of carbon by time of day
    scroll: 'svg[aria-label="Map of Great Britain by region"]'
    wait: 3000
  - path: /?region=13
    alt: London's carbon forecast for the next 48 hours, with the cleanest time to start a three hour job
    scroll: 'svg[role="slider"] >> text="low"'
    wait: 3000
