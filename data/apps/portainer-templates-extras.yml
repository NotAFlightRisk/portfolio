title: Portainer Templates Extras
category: self-hosted
tagline: Tested Portainer templates for self-hosted apps, added with one URL
about: >-
  Portainer can deploy an app in a click from a template, but the big template lists leave out
  plenty of good self-hosted apps. This fills in some of the gaps.
features:
  - Apps like AFFiNE, AnythingLLM, CyberChef and copyparty
  - Each one deploys with Portainer's defaults, or just a password
  - Every template's tested, and retested every week
  - A Compose file and a docker run command for each, if you'd rather skip Portainer
  - Ask for an app, or add one yourself
tags:
  - Self-hosting
  - Docker
site: https://portainer-templates-extras.peng.ly
screenshots:
  - path: /
    alt: The landing page, with the one templates URL to paste into Portainer and a strip of app icons
  - path: /
    alt: The grid of every app in the list, searchable and filterable by category and kind
    scroll: '#apps h3'
  - path: /copyparty
    alt: The copyparty page, with its compose file ready to copy next to a short description
    click: '#install-compose-tab'
