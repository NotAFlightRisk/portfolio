title: git-star-ranking
category: other
tagline: Where any GitHub user, organisation or repo ranks by stars
about: >-
  git-star-ranking ranks GitHub users, organisations and repos by stars, and tells you where you sit
  even if you're nowhere near the top. It picks up where @k0kubun's gitstar-ranking left off, after
  that shut down in November 2026.
features:
  - The top 10,000 users, organisations and repos to browse
  - A rank badge to show off in your README
  - Rankings refreshed every six hours
  - Sign in to get counted straight away, or to take yourself off the list
  - Signing in asks for no extra permissions, and your token's never stored
tags:
  - GitHub
  - Developer tools
site: https://git-star-ranking.com
screenshots:
  - path: /
    alt: The top GitHub users, organisations and repos by stars, side by side under a search box
  - path: /freeCodeCamp/freeCodeCamp
    alt: freeCodeCamp's repo ranked fifth by stars, with a chart of where it sits among 857,000 repos
  - path: /microsoft
    alt: Microsoft's page at number one, with its top repos, a rank badge and its nearest rivals
